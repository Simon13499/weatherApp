<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./output.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-[Poppins] bg-[#071226] text-white h-screen">

<section class="mt-6 flex justify-center items-center "> 

  <div class="flex flex-col w-full max-w-[1080px] rounded-[2rem] bg-[#0d1b35]/90 border border-white/10 shadow-2xl p-6">

    <h1 class="text-4xl font-bold mb-4">
      Počasí ve městě
    </h1>

    <div class="weather-form flex gap-2 mb-4">
      <input 
        id="city" 
        type="text" 
        class="rounded-2xl bg-white/10 border border-white/10 px-5 py-4 text-lg text-white placeholder:text-white/40 outline-none focus:ring-2 focus:ring-yellow-400 w-full" 
        placeholder="Zadej město"
      >
      <button id="searchBtn" type="button" class="w-16 rounded-2xl bg-yellow-400 text-2xl text-black hover:bg-yellow-300 transition">
        🔍
      </button>
    </div>

    <p class="weather-status mb-4"></p>

    <div class="weather-card"></div>

    <div class="hourly-table"></div>
   

  </div>
  
  
</section>

<div class="w-full flex justify-center mt-6">
  <div class="forecast grid grid-cols-1 gap-4 lg:grid-cols-3 w-full max-w-[1080px]">
  </div>
</div>


  


    <script src="script.js"></script>
    
</body>
</html>
